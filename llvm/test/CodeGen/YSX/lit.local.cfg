import os

if "ysx-registered-target" not in config.available_features:
    config.unsupported = True

# Expose the YSX auto-td guard suite to lit so a normal `check-llvm` run gates on
# it. Without this, the auto-td guards (no hand-written instruction TD, manifest
# round-trip, coverage) only ran on a manual `python -m unittest` and never
# failed a build or CI.
_ysx_auto_td_tests = os.path.join(
    config.llvm_src_root,
    "lib",
    "Target",
    "YuShuXin",
    "auto-td",
    "tests",
)
config.substitutions.append(
    (
        "%ysx-run-auto-td-guards",
        '"%s" -m unittest discover -s "%s" -p "test_*.py"'
        % (config.python_executable, _ysx_auto_td_tests),
    )
)
