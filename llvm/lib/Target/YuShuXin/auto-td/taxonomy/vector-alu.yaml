categories:
  int_add:
    domain: tinyv
    operation: add
    default_surfaces: [mc_def, decoder, sched, pseudo, pattern, builtin, coverage]
    operands:
      outs: [{role: dest, field: vd, reg_class: VR}]
      ins:
        - {role: lhs, field: vs2, reg_class: VR}
        - {role: rhs, field: vs1, reg_class: VR}
        - {role: mask_policy, field: vm, operand: VMaskOp}
    effects:
      may_load: false
      may_store: false
      has_side_effects: false
      implicit_uses: [VL, VTYPE]
    sched: {semantic_class: vector_int_alu}
  int_binary_vv:
    domain: tinyv
    operation: vector_int_binary
    default_surfaces: [mc_def, decoder, sched, pseudo, pattern, builtin, coverage]
    operands:
      outs: [{role: dest, field: vd, reg_class: VR}]
      ins:
        - {role: lhs, field: vs2, reg_class: VR}
        - {role: rhs, field: vs1, reg_class: VR}
        - {role: mask_policy, field: vm, operand: VMaskOp}
    effects:
      may_load: false
      may_store: false
      has_side_effects: false
      implicit_uses: [VL, VTYPE]
    sched: {semantic_class: vector_int_alu}
  int_compare_vv:
    domain: tinyv
    operation: vector_int_compare
    default_surfaces: [mc_def, decoder, sched, pseudo, pattern, builtin, coverage]
    operands:
      outs: [{role: mask_dest, field: vd, reg_class: VR}]
      ins:
        - {role: lhs, field: vs2, reg_class: VR}
        - {role: rhs, field: vs1, reg_class: VR}
        - {role: mask_policy, field: vm, operand: VMaskOp}
    effects:
      may_load: false
      may_store: false
      has_side_effects: false
      implicit_uses: [VL, VTYPE]
    sched: {semantic_class: vector_mask_alu}
  int_merge_vvm:
    domain: tinyv
    operation: vector_int_merge
    default_surfaces: [mc_def, decoder, sched, pseudo, pattern, builtin, coverage]
    operands:
      outs: [{role: dest, field: vd, reg_class: VR}]
      ins:
        - {role: false_value, field: vs2, reg_class: VR}
        - {role: true_value, field: vs1, reg_class: VR}
        - {role: carry_mask, field: vm, operand: VMaskCarryInOp}
    effects:
      may_load: false
      may_store: false
      has_side_effects: false
      implicit_uses: [VL, VTYPE]
    sched: {semantic_class: vector_int_alu}
  custom_float_unary:
    domain: tinyv
    operation: fexp
    default_surfaces: [mc_def, decoder, sched, pseudo, pattern, builtin, coverage]
    operands:
      outs: [{role: dest, field: vd, reg_class: VR}]
      ins:
        - {role: value, field: vs2, reg_class: VR}
        - {role: mask_policy, field: vm, operand: VMaskOp}
    effects:
      may_load: false
      may_store: false
      has_side_effects: false
      implicit_uses: [VL, VTYPE]
    sched: {semantic_class: vector_float_alu}
